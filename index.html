<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>さかなへんクイズ</title>
<meta name="description" content="魚へんの漢字を当てる4択クイズ。全20問、正解数とスピードで勝負！">
<meta property="og:type" content="website">
<meta property="og:title" content="さかなへんクイズ">
<meta property="og:description" content="魚へんの漢字を当てる4択クイズ。全20問、正解数とスピードで勝負！">
<meta property="og:url" content="https://techgymjp.github.io/sakanahen/">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="sea" id="sea" aria-hidden="true"></div>
<button id="btn-lang" class="lang">EN</button>
<button id="btn-mute" class="mute" aria-label="音のオン・オフ">🔊</button>
<main id="app">

  <section id="screen-title" class="screen active">
    <h1 class="logo"><span class="logo-k">魚</span><span data-t="logo">さかなへん<br>クイズ</span></h1>
    <p class="lead" data-t="lead">全20問・4択</p>
    <div class="buttons">
      <button id="btn-start" class="primary pulse big-start" data-t="start">スタート！</button>
    </div>
    <p class="best" id="best" hidden></p>
    <div class="menu">
      <button class="yellow" data-go="screen-howto">❓<span data-t="howto">あそびかた</span></button>
      <button class="yellow" data-go="screen-rank">🏆<span data-t="ranking">ランキング</span></button>
      <button class="yellow" id="btn-zukan">📖<span data-t="zukan">図鑑</span></button>
    </div>
    <!-- アプリ版だけ: バージョン・プライバシーポリシー・広告の設定（EU など） -->
    <p class="legal" id="legal" hidden>
      <span id="buildInfo"></span>
      <a id="privacyLink" href="https://techgym.jp/privacy-policy/" target="_blank" rel="noopener" data-t="privacy">プライバシーポリシー</a>
      <span id="adPrivacy" hidden>| <a href="#" id="adPrivacyLink" data-t="adSettings">広告の設定</a></span>
    </p>
  </section>

  <section id="screen-howto" class="screen">
    <h2 class="page-title">❓ <span data-t="howto">あそびかた</span></h2>
    <div class="panel">
      <ul class="rules" id="rules"></ul>
    </div>
    <div class="buttons">
      <button id="btn-start2" class="primary" data-t="start">スタート！</button>
      <button id="btn-howto-back" class="back" data-t="back">← もどる</button>
    </div>
  </section>

  <section id="screen-rank" class="screen">
    <h2 class="page-title">🏆 <span data-t="ranking">ランキング</span></h2>
    <div class="panel">
      <ol id="ranking" class="ranking"></ol>
    </div>
    <div class="buttons"><button class="back" data-home data-t="back">← もどる</button></div>
  </section>

  <section id="screen-quiz" class="screen">
    <header class="hud">
      <span id="q-num" class="chip">1 / 20</span>
      <span id="q-level" class="chip badge"></span>
      <span id="q-score" class="chip">⭕ 0</span>
      <span id="q-time" class="chip">⏱ 0.0</span>
      <button id="btn-pause" class="chip pause-btn" aria-label="一時停止">❚❚</button>
    </header>
    <div class="progress"><div id="progress-bar"></div></div>
    <div class="panel">
      <p id="q-text" class="question"></p>
    </div>
    <div id="choices" class="choices"></div>
    <div id="feedback" class="feedback"></div>
    <!-- アプリ版だけ: まちがえた問題を広告を見てやり直す -->
    <div id="redo" class="redo" hidden>
      <button id="redo-watch" class="primary"></button>
      <p id="redo-note" class="redo-note"></p>
      <button id="redo-next" class="back"></button>
    </div>
  </section>

  <section id="screen-pause" class="screen">
    <h2 class="page-title" data-t="pauseTitle">⏸ 一時停止中</h2>
    <div class="buttons">
      <button id="btn-resume" class="primary" data-t="resume">再開</button>
      <button id="btn-pause-home" class="yellow" data-t="home">タイトルへ</button>
    </div>
  </section>

  <section id="screen-result" class="screen">
    <h2 class="result-title" data-t="resultTitle">🎉 けっか 🎉</h2>
    <div class="score-row">
      <div class="score-box"><div class="lbl" data-t="lblCorrect">正解数</div><div class="val"><span id="r-correct"></span><small> / 20</small></div></div>
      <div class="score-box"><div class="lbl" data-t="lblTime">タイム</div><div class="val"><span id="r-time"></span><small data-t="sec"> 秒</small></div></div>
    </div>
    <p id="r-rank" class="rank-msg"></p>
    <p id="r-redo" class="redo-count" hidden></p>
    <div class="share">
      <p class="share-label" data-t="shareLabel">結果をシェアしよう！</p>
      <div class="share-buttons">
        <a id="share-x" class="share-btn x" target="_blank" rel="noopener" data-t="shareX">𝕏 ポスト</a>
        <a id="share-line" class="share-btn line" target="_blank" rel="noopener">LINE</a>
        <a id="share-fb" class="share-btn fb" target="_blank" rel="noopener">Facebook</a>
        <button id="share-more" class="share-btn more" hidden data-t="shareMore">その他</button>
        <button id="share-copy" class="share-btn copy">リンクをコピー</button>
      </div>
    </div>
    <div class="buttons">
      <button id="btn-retry" class="primary" data-t="retry">もう一度！</button>
      <button id="btn-home" class="yellow" data-t="home">タイトルへ</button>
    </div>
    <div class="panel">
      <h3 data-t="review">ふりかえり</h3>
      <ol id="review" class="review"></ol>
    </div>
  </section>

  <section id="screen-zukan" class="screen">
    <h2 class="page-title">📖 <span data-t="zukanTitle">漢字図鑑</span> <small id="z-count"></small></h2>
    <div class="panel">
      <h3 data-t="zukanEasy">🐟 お馴染みの魚</h3>
      <div id="zukan-easy" class="zukan"></div>
    </div>
    <div class="panel">
      <h3 data-t="zukanHard">🐡 難読の魚へん</h3>
      <div id="zukan-hard" class="zukan"></div>
    </div>
    <div class="buttons"><button class="back" data-home data-t="back">← もどる</button></div>
  </section>

</main>
<script src="data.js"></script>
<script src="i18n.js"></script>
<script src="sound.js"></script>
<script src="ads-config.js"></script>
<script src="build-info.js"></script>
<script src="ads.js"></script>
<script src="game.js"></script>
</body>
</html>
